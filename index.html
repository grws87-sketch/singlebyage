<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1인가구의 공간적 분리 — 청년 vs 노년</title>
  
  <!-- 1. Leaflet 지도 라이브러리 (CSS & JS) 불러오기 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* 화면 전체를 지도로 채우기 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 상단 제목 및 범례 박스 스타일링 */
    .info-card {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      max-width: 320px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .info-card h1 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 700;
      color: #111;
      line-height: 1.3;
    }
    .info-card p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #666;
    }

    /* 범례 스타일 */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: #444;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- 제목 및 범례 표시 상자 -->
  <div class="info-card">
    <h1>1인가구의 공간적 분리</h1>
    <p>청년은 어디에, 노년은 어디에?</p>
    
    <div class="legend">
      <div class="legend-item"><span class="color-dot" style="background: #1a73e8;"></span> 청년 비율 매우 우세 (+20%p 이상)</div>
      <div class="legend-item"><span class="color-dot" style="background: #64b5f6;"></span> 청년 비율 우세</div>
      <div class="legend-item"><span class="color-dot" style="background: #ff8a65;"></span> 노인 비율 우세</div>
      <div class="legend-item"><span class="color-dot" style="background: #d32f2f;"></span> 노인 비율 매우 우세 (+20%p 이상)</div>
      <div style="font-size: 11px; color: #888; margin-top: 4px;">* 원의 크기는 전체 1인가구 수에 비례합니다.</div>
    </div>
  </div>

  <!-- 지도가 그려질 영역 -->
  <div id="map"></div>

  <script>
    // 1. 지도 생성 (대한민국 중심 좌표 및 초기 줌 레벨)
    const map = L.map('map', {
      zoomControl: false // 줌 버튼 위치 조정을 위해 기본 위치 끄기
    }).setView([36.2, 127.8], 7);

    // 줌 컨트롤 버튼 오른쪽 아래로 배치
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    # 2. 배경 지도 타일 (CartoDB Light 깔끔한 지도)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '&copy; CartoDB'
    }).addTo(map);

    // 3. GeoJSON 데이터 불러오기 및 지도에 시각화
    fetch('single_age.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('GeoJSON 파일을 찾을 수 없습니다.');
        }
        return response.json();
      })
      .then(geojsonData => {
        
        L.geoJSON(geojsonData, {
          // 좌표 점(Point) 데이터를 원형 마커(CircleMarker)로 변환
          pointToLayer: function (feature, latlng) {
            const props = feature.properties;
            
            // 청년 비율 vs 노인 비율 차이 계산
            const diff = props.youth_ratio - props.senior_ratio;
            
            // 색상 조건 지정
            let color = '#888888';
            if (diff >= 0.20) color = '#1a73e8';       // 청년 매우 우세 (파랑)
            else if (diff > 0) color = '#64b5f6';      // 청년 약우세 (연파랑)
            else if (diff > -0.20) color = '#ff8a65';  // 노인 약우세 (주황)
            else color = '#d32f2f';                    // 노인 매우 우세 (빨강)

            // 원 크기 계산 (전체 1인가구 수의 제곱근 비례)
            const radius = Math.sqrt(props.total_single) * 0.08;

            return L.circleMarker(latlng, {
              radius: Math.max(radius, 3), // 최소 크기 보장
              fillColor: color,
              color: '#ffffff',            // 원 테두리 색상 (흰색)
              weight: 1.2,                 // 테두리 두께
              opacity: 0.9,
              fillOpacity: 0.7
            });
          },

          // 각 마커 클릭 시 팝업 안내창 띄우기
          onEachFeature: function (feature, layer) {
            const props = feature.properties;
            
            const popupContent = `
              <div style="padding: 4px; font-family: sans-serif;">
                <h3 style="margin: 0 0 8px 0; font-size: 15px; border-bottom: 2px solid #333; padding-bottom: 4px;">
                  ${props.fullName}
                </h3>
                <div style="font-size: 13px; line-height: 1.6; color: #333;">
                  <b>전체 1인가구:</b> ${props.total_single.toLocaleString()} 가구<br>
                  <span style="color:#1a73e8;"><b>청년 비율 (20~39세):</b> ${(props.youth_ratio * 100).toFixed(1)}%</span> (${props.youth_cnt.toLocaleString()}명)<br>
                  <span style="color:#d32f2f;"><b>노인 비율 (65세+):</b> ${(props.senior_ratio * 100).toFixed(1)}%</span> (${props.senior_cnt.toLocaleString()}명)
                </div>
              </div>
            `;
            
            layer.bindPopup(popupContent);
          }
        }).addTo(map);

      })
      .catch(error => {
        console.error('데이터 로드 중 에러 발생:', error);
      });
  </script>

</body>
</html>
